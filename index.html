<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Sunta MDF kesim siparişlerini müşteri adına göre arayan basit takip sistemi." />
    <title>Sipariş Sunucusu</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <section class="auth-screen" id="authScreen" aria-label="Giriş ekranı">
      <form class="auth-card" id="loginForm" autocomplete="off">
        <div class="auth-copy">
          <p class="auth-kicker">Sipariş Takip</p>
          <h1>Giriş Yap</h1>
          <p>Devam etmek için şifreyi gir.</p>
        </div>
        <label class="auth-field" for="passwordInput">
          <span>Şifre</span>
          <input id="passwordInput" type="password" autocomplete="current-password" placeholder="Şifre" />
        </label>
        <p class="auth-error" id="authError" role="alert" aria-live="polite"></p>
        <button class="auth-button" type="submit">Giriş</button>
      </form>
    </section>

    <main class="shell" id="appShell" hidden>
      <section class="hero">
        <aside class="hero-panel">
          <label class="search-label" for="searchInput">Müşteri adı ara</label>
          <input id="searchInput" type="search" placeholder="Örn. Ahmet Demirel" autocomplete="off" />
          <p class="hint">Kısmını yaz. Son siparişler listelenir.</p>
          <div class="mini-stats" aria-label="Özet bilgiler">
            <span><strong id="totalRecords">0</strong> Toplam kayıt</span>
            <span><strong id="totalFiles">0</strong> İşlenen dosya</span>
            <span><strong id="matchedRecords">0</strong> Eşleşen sonuç</span>
          </div>
        </aside>
      </section>

      <section class="table-card">
        <div class="table-head">
          <h2>Sonuçlar</h2>
          <p id="resultLabel">Henüz arama yapılmadı.</p>
        </div>
        <div class="pager" id="pager" aria-label="Sayfalama"></div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Tarih</th>
                <th>Dosya</th>
                <th>MALZEME</th>
                <th>PVC Metraj</th>
                <th>Kesim</th>
                <th>OPT</th>
                <th>Notlar</th>
              </tr>
            </thead>
            <tbody id="resultsBody"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="./supabase.config.js"></script>
    <script src="./local-database.js"></script>
    <script src="./app.js?v=20260520c"></script>
  </body>
</html>
